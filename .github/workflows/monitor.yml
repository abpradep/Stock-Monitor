name: stock-monitor

on:
  schedule:
    # 7 AM, 10 AM, 1 PM, 4 PM and 7 PM IST (01:30-13:30 UTC every 3 hours), every day.
    # Each run sends any new alerts, then the Claude report.
    - cron: "30 1-13/3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "report, scan, summary or test"
        default: "test"

permissions:
  contents: write

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python monitor.py ${{ github.event.inputs.mode || 'report' }}

      - name: Save state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "stock-monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
