name: stock-monitor

on:
  schedule:
    - cron: "*/30 3-16 * * *"   # every 30 min, ~9:00 AM to 10:30 PM IST, every day
    - cron: "30 13 * * *"       # 7:00 PM IST daily summary
  workflow_dispatch:
    inputs:
      mode:
        description: "scan, summary or test"
        default: "test"

permissions:
  contents: write

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then
            python monitor.py summary
          else
            python monitor.py ${{ github.event.inputs.mode || 'scan' }}
          fi

      - name: Save state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "stock-monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
